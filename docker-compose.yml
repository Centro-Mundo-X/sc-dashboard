services:
  app:
    image: ghcr.io/centro-mundo-x/sc-dashboard:v0.1.0-demo
    restart: unless-stopped
    ports:
      - '3000:8080'
    volumes:
      - sc-data:/app/data
    environment:
      DATABASE_PATH: /app/data/data.sqlite
      DEVICE_TOKEN: ${DEVICE_TOKEN:?set DEVICE_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      # Same names as `pnpm dev`: PORT is the API, WEB_PORT the dashboard.
      PORT: 3000
      WEB_PORT: 8080
      # Public URL of the dashboard. Required: it rejects form POSTs from any
      # other origin.
      ORIGIN: ${ORIGIN:?set ORIGIN, e.g. https://sc.example.com}
      # Addresses allowed to set X-Forwarded-*. Only the dashboard talks to the
      # API, and it does so from the loopback.
      TRUST_PROXY: ${TRUST_PROXY:-127.0.0.1}
      # Fills the database with the sample user and session on first start.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_USER: ${SEED_USER:-demo}
      SEED_PASSWORD: ${SEED_PASSWORD:-demo-access-2024}
    # No `curl` in the image: the check goes through the dashboard to the API.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.WEB_PORT ?? 8080) + '/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  sc-data:
