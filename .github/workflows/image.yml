name: image

# Builds the container image and pushes it to GitHub Container Registry.
#
# Runs on tags and on demand. Not on every push to a branch: the image only
# matters when it is about to be deployed.
#
# When the repository is not published yet this workflow simply does not run.
# Nothing else in the project depends on it.
#
# The image sets NODE_ENV=production, which makes the session cookie `Secure`.
# The dashboard only logs in over HTTPS, so serve it behind a TLS proxy.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One rule per situation, so every run produces a usable tag:
      #   tag v1.2.0  -> v1.2.0, 1.2.0, 1.2, latest
      #   tag demo    -> demo
      #   manual run  -> the branch name, so a manual run is never tagless
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
