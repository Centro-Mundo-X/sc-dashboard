apiVersion: v1
kind: Pod
metadata:
  name: simulacion-clinica
spec:
  containers:
    - name: app
      # Built from the Dockerfile in this repository:
      #   podman build -t simulacion-clinica .
      # Change this if you push the image to a registry.
      image: localhost/simulacion-clinica:latest
      envFrom:
        - configMapRef:
            name: env
      ports:
        - containerPort: 3000
          hostPort: 3000
      livenessProbe:
        httpGet:
          path: /health
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 5
      volumeMounts:
        - name: data
          mountPath: /app/data

  volumes:
    - name: data
      hostPath:
        path: /opt/simulacion-clinica/data
        type: DirectoryOrCreate
