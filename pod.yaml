apiVersion: v1
kind: Pod
metadata:
  name: simulacion-clinica
spec:
  containers:
    - name: app
      # Demo image: it seeds a sample user and session on first start.
      # Change the tag to move to a release image.
      image: ghcr.io/centro-mundo-x/sc-dashboard:demo
      envFrom:
        - configMapRef:
            name: env
      ports:
        - containerPort: 3000
          hostPort: 3000
      livenessProbe:
        httpGet:
          path: /health
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 5
      volumeMounts:
        - name: data
          mountPath: /app/data

  volumes:
    - name: data
      hostPath:
        path: /opt/simulacion-clinica/data
        type: DirectoryOrCreate
