apiVersion: v1
kind: Pod
metadata:
  name: simulacion-clinica
spec:
  containers:
    - name: app
      # Demo image: it seeds a sample user and session on first start.
      # Change the tag to move to a release image.
      image: ghcr.io/centro-mundo-x/sc-dashboard:v0.1.0-demo-20261108
      env:
        - name: DATABASE_PATH
          value: "/app/data/data.sqlite"
        # PORT is the API, WEB_PORT the dashboard. Same names as `pnpm dev`.
        - name: PORT
          value: "3000"
        - name: WEB_PORT
          value: "8080"

        # Public URL of the dashboard, no trailing slash.
        - name: ORIGIN
          value: "https://sc.example.com"

        # Addresses allowed to set X-Forwarded-*. Only the dashboard talks to the
        # API, and it does so from the loopback.
        - name: TRUST_PROXY
          value: "127.0.0.1"

        # Bearer token the headset sends when ingesting. Generate with:
        #   openssl rand -hex 24
        - name: DEVICE_TOKEN
          value: "change-device-token"

        # Signs the dashboard session cookie. At least 32 characters. Generate with:
        #   openssl rand -hex 32
        - name: SESSION_SECRET
          value: "change-secret-of-at-least-32-characters"

        # Fills the database with the sample user and session on first start.
        - name: SEED_DEMO_DATA
          value: "true"
        - name: SEED_USER
          value: "demo"
        - name: SEED_PASSWORD
          value: "demo-access-2024"
      ports:
        - containerPort: 8080
          hostPort: 3000
      # podman falls back to curl for httpGet probes, and this image has no
      # curl. Node is already there, so the check runs with it instead.
      livenessProbe:
        exec:
          command:
            - node
            - -e
            - fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
        initialDelaySeconds: 30
        periodSeconds: 30
        failureThreshold: 5
      volumeMounts:
        - name: data
          mountPath: /app/data

  volumes:
    - name: data
      hostPath:
        path: /opt/sc-dashboard/data
        type: DirectoryOrCreate
