services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - sc-data:/app/data
    environment:
      DATABASE_PATH: /app/data/data.sqlite
      DEVICE_TOKEN: ${DEVICE_TOKEN:?set DEVICE_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      PORT: 3000

volumes:
  sc-data:
